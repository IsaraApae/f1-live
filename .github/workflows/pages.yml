# Publishes the site to GitHub Pages: on every push to main, and every 30 minutes so the headlines stay fresh.
# (Settings → Pages → Source must be "GitHub Actions".)
name: pages
on:
  push:
    branches: [main]
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# one publish at a time; a queued one waits rather than cancelling a deploy halfway
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-26.04
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      # each action at an exact commit (its version beside it), so a moved tag can't change what runs; Dependabot updates them
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
      - id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d   # v6.0.0
      # side by side, as none needs another: the site's checks (a failure stops the publish), the headlines (from the live
      # news.json: headlines without a date in their feed keep their first-seen time, and if every feed fails the last list
      # stays up) and every circuit's pit lane for the Live tab (OpenF1 doesn't answer free requests during a session: start
      # from the live copy, add circuits that have had a new race since; the committed pitlanes.json stays if this fails).
      # The headlines and pit lanes never stop the publish.
      - name: Check, collect headlines, update pit lanes
        env:
          SITE: ${{ steps.pages.outputs.base_url }}
        run: |
          ( curl -fsSL --max-time 20 "$SITE/news.json" -o news.json || rm -f news.json
            node scripts/news.mjs news.json ) > news.log 2>&1 &
          news=$!
          ( curl -fsSL --max-time 20 "$SITE/pitlanes.json" -o live-pitlanes.json && node -e "JSON.parse(require('fs').readFileSync('live-pitlanes.json'))" && mv live-pitlanes.json pitlanes.json || rm -f live-pitlanes.json
            timeout 300 node scripts/pitlanes.mjs pitlanes.json ) > pitlanes.log 2>&1 &
          pit=$!
          node --version   # the runner's own Node (no setup step: it saved a few seconds a publish)
          node tools/check.mjs
          wait $news || echo "::warning::headlines not updated (the last list stays)"; cat news.log
          wait $pit || echo "::warning::pit lanes not updated (the committed ones stay)"; cat pitlanes.log
          rm -rf news.log pitlanes.log docs tools scripts   # README pictures and build tools: not part of the site
      # the published scripts and styles minified (about a quarter less to download), each with a source map so the browser's
      # developer tools still show the readable code. The code in the repository stays as it is. If esbuild can't be fetched,
      # or a minified script doesn't parse, the readable files go out instead: never a reason not to publish.
      - name: Minify scripts and styles
        run: |
          readable() { echo "::warning::$1: publishing the readable files"; git checkout -- js css; find js css -name "*.map" -delete; }
          if npx --yes esbuild@0.28.2 $(find js -name "*.js") css/*.css --minify --sourcemap --outdir=. --outbase=. --allow-overwrite --log-level=warning; then
            for f in $(find js -name "*.js"); do cp "$f" "$RUNNER_TEMP/m.mjs"; node --check "$RUNNER_TEMP/m.mjs" || { readable "$f doesn't parse once minified"; break; }; done
          else readable "not minified (esbuild unavailable)"; fi
      # a new cache name per commit, so installed apps pick up each release (scheduled runs of the same commit keep it)
      - name: Stamp the service worker
        run: |
          sed -i "s/^const VERSION = \"[^\"]*\";/const VERSION = \"${GITHUB_SHA::12}\";/" sw.js
          grep -q "${GITHUB_SHA::12}" sw.js
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9   # v5.0.0 (leaves out .git and .github)
        with:
          path: .
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346   # v5.0.1
