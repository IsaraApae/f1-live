# Checks pull requests (pushes to main are checked by pages.yml before publishing)
name: check
on:
  pull_request:
jobs:
  check:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: node tools/check.mjs
