<!doctype html>
<html lang="en" data-mode="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>F1 Live</title>
<meta name="description" content="Free Formula 1 companion: live timing, track map, race control, weather, the season calendar in your time zone, standings, full replays with telemetry, and lap battles.">
<meta name="theme-color" content="#0b0b10">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://api.openf1.org" crossorigin>
<link rel="preconnect" href="https://api.jolpi.ca" crossorigin>
<link rel="preconnect" href="https://media.formula1.com">
<link rel="preconnect" href="https://api.open-meteo.com" crossorigin>
<!-- the headings' font (css/app.css), asked for at once so it's usually in before the first paint; the page never waits for it -->
<link rel="preload" href="fonts/titillium-web-900-latin.woff2" as="font" type="font/woff2" crossorigin>
<script>
  // appearance before the page draws, so it never flashes the wrong colours
  (function () {
    var pick = "dark"; try { pick = JSON.parse(localStorage.getItem("f1.theme")) || "dark"; } catch (e) {}
    var dark = pick === "dark" || (pick === "device" && matchMedia("(prefers-color-scheme: dark)").matches);
    document.documentElement.dataset.mode = dark ? "dark" : "light";
  })();
  // a LINE card opens a replay, a full result or the Live tab (?replay=KEY, ?result=KEY, ?live): fetch that page's modules now,
  // alongside main.js, instead of one layer of imports at a time after it has started (the same for those pages' own #/ links)
  (function () {
    var q = new URLSearchParams(location.search), h = location.hash, timing = ["timing.js", "livepos.js", "analysis.js", "geomap.js"], files = [];
    if (/^#\/replay\/\d+$/.test(h) || (!h && q.get("replay"))) files = ["views/replay.js"].concat(timing);
    else if (/^#\/result\/\d+$/.test(h) || (!h && q.get("result"))) files = ["views/result.js", "views/weekend.js", "calendar-ui.js"];
    else if (/^#\/live$/.test(h) || (!h && q.has("live"))) files = ["views/live.js"].concat(timing);
    else if (/^#\/calendar\/\d{4}\/\d+/.test(h)) files = ["views/weekend.js", "calendar-ui.js"];
    files.forEach(function (f) { var l = document.createElement("link"); l.rel = "modulepreload"; l.href = "js/" + f; document.head.appendChild(l); });
    // and the page's own stylesheet, at full speed rather than the low priority the page styles below get (only a head start:
    // their data-pages decide which page uses which)
    var page = h ? (/^#\/(\w+)/.exec(h) || [])[1] : q.get("replay") ? "replay" : q.get("result") ? "result" : q.has("live") ? "live" : "";
    var css = { live: "timing", replay: "timing", calendar: "calendar", result: "calendar", standings: "standings", driver: "standings", team: "standings", battle: "battle", news: "news" }[page];
    if (css) { var l = document.createElement("link"); l.rel = "preload"; l.as = "style"; l.href = "css/" + css + ".css"; document.head.appendChild(l); }
  })();
</script>
<link rel="stylesheet" href="css/app.css">
<!-- each page's own styles: downloaded in the background without holding up the first paint (media="print"), and switched on
     by main.js before a page in data-pages is first drawn. They stay in this order, so whichever are on, the same rule wins. -->
<link rel="stylesheet" href="css/timing.css" media="print" data-pages="live replay" onload="this.dataset.ready=1" onerror="this.dataset.ready=1">
<link rel="stylesheet" href="css/calendar.css" media="print" data-pages="calendar weekend result" onload="this.dataset.ready=1" onerror="this.dataset.ready=1">
<link rel="stylesheet" href="css/standings.css" media="print" data-pages="standings driver team" onload="this.dataset.ready=1" onerror="this.dataset.ready=1">
<link rel="stylesheet" href="css/battle.css" media="print" data-pages="battle" onload="this.dataset.ready=1" onerror="this.dataset.ready=1">
<link rel="stylesheet" href="css/news.css" media="print" data-pages="news" onload="this.dataset.ready=1" onerror="this.dataset.ready=1">
<!-- fetch the modules together, not one layer of imports at a time -->
<link rel="modulepreload" href="js/main.js">
<link rel="modulepreload" href="js/util.js">
<link rel="modulepreload" href="js/api.js">
<link rel="modulepreload" href="js/final.js">
<link rel="modulepreload" href="js/cutout.js">
<link rel="modulepreload" href="js/season.js">
<link rel="modulepreload" href="js/news.js">
<link rel="modulepreload" href="js/views/home.js">
<script type="module" src="js/main.js"></script>
</head>
<body>
<div class="app">
  <nav class="rail" aria-label="Sections">
    <a class="brand" href="#/"><b>F1 Live</b></a>
    <div class="rail-links" id="railLinks"></div>
  </nav>
  <div class="page">
    <header class="appbar">
      <a class="iconbtn" id="back" href="#/" hidden aria-label="Back"></a>
      <h1 id="title">F1 Live</h1>
      <div class="appbar-tools" id="tools"></div>
    </header>
    <div class="busy" id="busy" hidden></div>
    <main id="view" tabindex="-1"></main>
  </div>
  <nav class="tabbar" id="tabbar" aria-label="Sections"></nav>
</div>
<div class="toasts" id="toasts" aria-live="polite"></div>
</body>
</html>
