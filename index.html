<!doctype html>
<html lang="en" data-mode="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>F1 Live</title>
<meta name="description" content="Free Formula 1 companion: live timing, track map, race control, weather, the season calendar in your time zone, standings, full replays with telemetry, and lap battles.">
<meta name="theme-color" content="#0b0b10">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Titillium+Web:wght@600;700;900&display=swap">
<script>
  // appearance before the page draws, so it never flashes the wrong colours
  (function () {
    var pick = "dark"; try { pick = JSON.parse(localStorage.getItem("f1.theme")) || "dark"; } catch (e) {}
    var dark = pick === "dark" || (pick === "device" && matchMedia("(prefers-color-scheme: dark)").matches);
    document.documentElement.dataset.mode = dark ? "dark" : "light";
  })();
</script>
<link rel="stylesheet" href="css/app.css">
<link rel="stylesheet" href="css/timing.css">
<link rel="stylesheet" href="css/calendar.css">
<link rel="stylesheet" href="css/standings.css">
<link rel="stylesheet" href="css/battle.css">
<link rel="stylesheet" href="css/news.css">
<script type="module" src="js/main.js"></script>
</head>
<body>
<div class="app">
  <nav class="rail" aria-label="Sections">
    <a class="brand" href="#/"><b>F1 Live</b></a>
    <div class="rail-links" id="railLinks"></div>
  </nav>
  <div class="page">
    <header class="appbar">
      <a class="iconbtn" id="back" href="#/" hidden aria-label="Back"></a>
      <h1 id="title">F1 Live</h1>
      <div class="appbar-tools" id="tools"></div>
    </header>
    <div class="busy" id="busy" hidden></div>
    <main id="view" tabindex="-1"></main>
  </div>
  <nav class="tabbar" id="tabbar" aria-label="Sections"></nav>
</div>
<div class="toasts" id="toasts" aria-live="polite"></div>
</body>
</html>
